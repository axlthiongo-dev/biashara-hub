services:
  - type: web
    name: biashara-hub-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biashara-hub-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://axlthiongo-dev.github.io
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: biashara-hub-db
    plan: free
    databaseName: biashara_hub
    user: biashara_hub
