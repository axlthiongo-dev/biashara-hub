[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biashara-hub-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlmodel>=0.0.22", "PyJWT>=2.9", "pwdlib[argon2]>=0.2", "httpx>=0.27", "pydantic-settings>=2.5", "email-validator>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
